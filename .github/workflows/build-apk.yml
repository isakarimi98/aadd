name: Build Native Android APK (API 34)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK (API 34)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Accept Licenses & Install Android Build-Tools
        run: |
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          echo "Installing platforms and build-tools 34..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Native Android APK
        run: |
          cd android
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Locate Output APKs
        run: |
          echo "Listing generated APK files:"
          find android/app/build/outputs/ -type f || true

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotocopyPlus-Native-APK
          path: |
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
