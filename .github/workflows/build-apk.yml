name: Build Android APK (API 34) - Bazaar & Myket

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (API 34)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Dist to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/*
          cp -r dist/* android/app/src/main/assets/
          echo "Web assets successfully copied into Android app bundle:"
          ls -la android/app/src/main/assets/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Android APK with Gradle
        run: |
          cd android
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Locate Output APKs
        run: |
          echo "Listing generated APK files:"
          find android/app/build/outputs/ -type f || true

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotocopyPlus-Android-APK
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 14
