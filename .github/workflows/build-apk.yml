name: Build Android APK (API 34) - Bazaar & Myket

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK and AAB (API Level 34)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up Java 17 (Required for Android Gradle Plugin 8+ & API 34)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          api-version: 34
          build-tools-version: 34.0.0

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android APK & Bundle
        run: |
          if [ -f "./android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug assembleRelease --no-daemon
          else
            echo "Building via Capacitor CLI..."
            npx @capacitor/cli copy android || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotocopyPlus-Android-APK
          path: |
            android/app/build/outputs/apk/**/*.apk
            dist/
          retention-days: 14
